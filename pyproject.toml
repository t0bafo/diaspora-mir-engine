[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diaspora-mir-engine"
version = "1.3.0"
description = "A Culturally-Informed Music Information Retrieval (MIR) & Audio DSP Engine for African Diasporic Genres"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "librosa==0.10.2",
    "soundfile==0.12.1",
    "audioread==3.0.1",
    "essentia>=2.1b6.dev1110,<2.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "scikit-learn==1.5.0",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "streamlit==1.35.0",
    "plotly==5.22.0",
    "tqdm==4.66.4",
    "mutagen==1.47.0",
    "tabulate==0.9.0",
]

[tool.setuptools.package-dir]
"" = "packages"

[tool.setuptools.packages.find]
where = ["packages"]
